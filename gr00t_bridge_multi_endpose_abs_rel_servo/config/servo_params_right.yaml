# MoveIt Servo parameters for FFW SG2 RIGHT arm (arm_r)
# Reference: https://github.com/moveit/moveit2/blob/main/moveit_ros/moveit_servo/config/servo_parameters.yaml

moveit_servo:

  ## General
  thread_priority: 40
  publish_period: 0.02            # 50 Hz output rate
  max_expected_latency: 0.1
  move_group_name: "arm_r"
  planning_frame: "arm_r_link1"
  ee_frame_name: "arm_r_link7"
  active_subgroup: ""

  ## Incoming command settings
  pose_command_in_topic: "~/pose_target_cmds"
  cartesian_command_in_topic: "~/delta_twist_cmds"
  joint_command_in_topic: "~/delta_joint_cmds"
  command_in_type: "speed_units"
  incoming_command_timeout: 1.0   # 0.3 can drop commands between inference cycles

  scale:
    linear: 0.4               # m/s — 동작 확인용 (특이점에서도 소폭 움직임 나오도록)
    rotational: 0.8                # rad/s
    joint: 0.5

  ## Twist settings
  apply_twist_commands_about_ee_frame: true

  ## Pose tracking
  pose_tracking:
    linear_tolerance: 0.0001    # 1mm -> 0.1mm 로 축소
    angular_tolerance: 0.001    # ~0.057 deg 로 축소

  ## Outgoing command settings
  status_topic: "~/status"
  command_out_topic: "/leader/joint_trajectory_command_broadcaster_right/joint_trajectory"
  command_out_type: "trajectory_msgs/JointTrajectory"
  publish_joint_positions: true
  publish_joint_velocities: false
  publish_joint_accelerations: false

  ## Planning scene monitor
  monitored_planning_scene_topic: "/planning_scene"
  joint_topic: "/joint_states"
  check_octomap_collisions: false
  is_primary_planning_scene_monitor: true

  ## Smoothing
  use_smoothing: false
  smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"

  ## Collision
  check_collisions: true
  self_collision_proximity_threshold: 0.01
  scene_collision_proximity_threshold: 0.02
  collision_check_rate: 10.0

  ## Singularity
  lower_singularity_threshold: 17.0        # 감속 시작 기준 (매우 큰 값)
  hard_stop_singularity_threshold: 30.0    # 완전 정지 기준 (lower 보다 커야 함!)
  leaving_singularity_threshold_multiplier: 1.0
  singularity_step_scale: 1.0                # 감속 없이 100% 속도 유지

  ## Joint limiting
  halt_all_joints_in_joint_mode: true
  halt_all_joints_in_cartesian_mode: true
  joint_limit_margins: [0.1]
  override_velocity_scaling_factor: 1.0
  wait_for_initial_state_timeout: 10.0
