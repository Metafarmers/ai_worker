# MoveIt Servo parameters for FFW SG2 LEFT arm (arm_l)
# Reference: https://github.com/moveit/moveit2/blob/main/moveit_ros/moveit_servo/config/servo_parameters.yaml

moveit_servo:

  ## General
  thread_priority: 40
  publish_period: 0.02            # 50 Hz output rate
  max_expected_latency: 0.1
  move_group_name: "arm_l"
  planning_frame: "arm_l_link1"
  ee_frame_name: "arm_l_link7"
  active_subgroup: ""

  ## Incoming command settings
  pose_command_in_topic: "~/pose_target_cmds"
  cartesian_command_in_topic: "~/delta_twist_cmds"
  joint_command_in_topic: "~/delta_joint_cmds"
  command_in_type: "speed_units"
  incoming_command_timeout: 1.0   # 0.3 can drop commands between inference cycles

  scale:
    linear: 0.2                   # m/s — 동작 확인용 (특이점에서도 소폭 움직임 나오도록)
    rotational: 0.4                # rad/s
    joint: 0.5

  ## Twist settings
  apply_twist_commands_about_ee_frame: true

  ## Pose tracking
  pose_tracking:
    linear_tolerance: 0.001       # 1 mm
    angular_tolerance: 0.01       # ~0.57 deg

  ## Outgoing command settings
  status_topic: "~/status"
  command_out_topic: "/leader/joint_trajectory_command_broadcaster_left/joint_trajectory"
  command_out_type: "trajectory_msgs/JointTrajectory"
  publish_joint_positions: true
  publish_joint_velocities: true
  publish_joint_accelerations: false

  ## Planning scene monitor
  monitored_planning_scene_topic: "/planning_scene"
  joint_topic: "/joint_states"
  check_octomap_collisions: false
  is_primary_planning_scene_monitor: true

  ## Smoothing
  use_smoothing: true
  smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"

  ## Collision
  check_collisions: true
  self_collision_proximity_threshold: 0.01
  scene_collision_proximity_threshold: 0.02
  collision_check_rate: 10.0

  ## Singularity — threshold 낮추면 특이점 근처에서도 속도가 덜 잘리어 움직임 가능 (안전 주의)
  lower_singularity_threshold: 0.005
  hard_stop_singularity_threshold: 30.0
  leaving_singularity_threshold_multiplier: 2.0
  singularity_step_scale: 0.01

  ## Joint limiting
  halt_all_joints_in_joint_mode: true
  halt_all_joints_in_cartesian_mode: true
  joint_limit_margins: [0.1]
  override_velocity_scaling_factor: 1.0
  wait_for_initial_state_timeout: 10.0