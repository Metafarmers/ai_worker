bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    default_nav_to_pose_bt_xml: /root/ros2_ws/install/ffw_navigation/share/ffw_navigation/config/bt/nav_modes.xml
    default_nav_through_poses_bt_xml: /root/ros2_ws/install/ffw_navigation/share/ffw_navigation/config/bt/nav_modes.xml
    plugin_lib_names: ["is_path_length_under_plugin", "nav2_behavior_tree"]
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    transform_tolerance: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["OmniController", "CurveController"]

    # Progress Checker & Goal Checker (기본 설정 유지)
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.10
      stateful: true

    # ---------------------------------------------------------
    # 1. OmniController (1m 이하: 게걸음/Crab 주행)
    # 특징: 경로 방향 무시, Goal Angle 유지, 횡이동(vy) 적극 활용
    # ---------------------------------------------------------
    OmniController:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40
      model_dt: 0.05
      batch_size: 1200
      
      # [Motion Model] 전방향 이동
      motion_model: "Omni"
      vx_std: 0.12
      vy_std: 0.1
      wz_std: 0.2
      vx_max: 0.35
      vx_min: -0.35
      vy_max: 0.45   # 횡이동 허용
      vy_min: -0.45  # 횡이동 허용
      wz_max: 0.8
      ax_max: 6.0  # (기존 3.0 -> 5.0)
      ax_min: -6.0
      ay_max: 6.0  # (기존 3.0 -> 5.0)
      ay_min: -6.0
      az_max: 4.0
      
      iteration_count: 1
      temperature: 0.25
      gamma: 0.018
      visualize: false
      
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      
      # [Critics] 게걸음 특화 설정
      critics: 
        - ConstraintCritic
        - CostCritic 
        - GoalCritic 
        - GoalAngleCritic 
        - PathFollowCritic
        # - PathAlignCritic 
        # - PreferForwardCritic (제거: 횡이동 허용)
        
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.2
      
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0  # 목표 헤딩 맞춤 강화
        threshold_to_consider: 0.25  # 25cm 이내에서만 헤딩 보정
        
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
        
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        offset_from_furthest: 1
        threshold_to_consider: 1.2

    # ---------------------------------------------------------
    # 2. CurveController (1m 이상: 회전 후 전진)
    # 특징: 경로 방향(Align) 중시, 전진(Forward) 선호
    # ---------------------------------------------------------
    CurveController:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40
      model_dt: 0.05
      batch_size: 1200
      
      # [Motion Model] Swerve지만 차처럼 거동 유도
      motion_model: "Omni" 
      vx_std: 0.17        # 0.2 -> 0.15 (요동 감소)
      vy_std: 0.12        # 0.2 -> 0.12 (횡 흔들림 감소)
      wz_std: 0.3         # 0.4 -> 0.3
      vx_max: 0.5
      vx_min: 0.0
      vy_max: 0.25        # 0.3 -> 0.25
      vy_min: -0.25
      wz_max: 1.6         # 1.9 -> 1.6 (급회전 억제)

      iteration_count: 1
      temperature: 0.27   # 0.3 -> 0.25 (조금 더 수렴 지향)
      gamma: 0.02  
      visualize: false

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      # [Critics] 일반 주행(Align) 특화 설정
      critics: 
        - ConstraintCritic
        - CostCritic 
        - GoalCritic 
        - GoalAngleCritic 
        - PathAlignCritic 
        - PathFollowCritic 
        - PathAngleCritic 
        - PreferForwardCritic
        
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.2
        
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0 # 주행 중에는 너무 강제하지 않음 (도착해서 맞춤)
        threshold_to_consider: 0.3
        
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 9.0  # omni 여유를 남기되 전진 선호 유지
        threshold_to_consider: 0.5
        
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.2
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
        
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0 # 경로 방향 강하게 추종
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 2
        threshold_to_consider: 1.0
        offset_from_furthest: 15
        use_path_orientations: true # 경로 orientation 그대로 사용
        
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        offset_from_furthest: 5
        threshold_to_consider: 1.2
        
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        offset_from_furthest: 3
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.4
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.3
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.44
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.65
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0   
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.3
      robot_radius: 0.44
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: False
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["SmacPlannerHybrid"]
    costmap_update_timeout: 1.0
    SmacPlannerHybrid:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 0.5
      allow_unknown: true
      use_final_approach_orientation: false
      minimum_turning_radius: 0.0         # 직선 경로 유도, 급커브 억제
      motion_model_for_search: "REEDS_SHEPP"
      allow_reverse: true
      angle_quantization_bins: 24
      analytic_expansion_ratio: 1.0
      max_iterations: 40000
      max_on_approach_iterations: 12000
      cost_travel_multiplier: 1.0
      cost_heuristic_multiplier: 2.5   # 직선 성향 강화
      non_straight_penalty: 10.5        # 곡선 패널티
      change_penalty: 2.0              # 방향 전환 패널티
      rotation_penalty: 1.5
      downsample_costmap: false
      downsampling_factor: 1
      smooth_path: true
      cache_obstacle_heuristic: true
      # do_refinement: False
      smoother:
        max_iterations: 800
        w_smooth: 0.9   # 직선화 더 강화
        w_data: 0.05
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 200
      do_refinement: False

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 5

# ▼▼▼ [필수 수정] Y축 속도 제한 해제 ▼▼▼
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # Y축 속도 0.5, 가속도 2.5 허용 (게걸음 필수)
    max_velocity: [0.5, 0.5, 2.0]
    min_velocity: [-0.5, -0.5, -2.0]
    max_accel: [2.5, 2.5, 3.2]
    max_decel: [-2.5, -2.5, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 3.0   # 급감속 덜 하도록 여유 시간 증가
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    use_sim_time: True
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3
